<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Transparency IGs: HL7 Austria vs HL7 International</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1d232b; --muted:#5d6875; --line:#d9dee5; --soft:#eef1f5;
  --at:#b3261e; --intl:#1f5fa8;
  --r-unrec:#c62828; --r-change:#d98a00; --r-derive:#2e6fd1; --r-equiv:#2e8b57;
  --hl:#fff3b0; --hlline:#e0b400;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
code{font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--soft);padding:0 3px;border-radius:3px}
a{color:#1f5fa8}
#top{height:42px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#1d232b;color:#fff}
#top h1{font-size:15px;margin:0;font-weight:600}
#top .meta{font-size:11.5px;color:#c9d1db}
#top .meta code{background:#333c47;color:#fff}
#top .grow{flex:1}
#top button{background:#333c47;color:#fff;border:1px solid #4a5563;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px}
#grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,0.78fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100vh - 42px)}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line);position:relative}
.colhead{flex:0 0 auto;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px}
.colhead .tag{font-weight:700;color:#fff;border-radius:3px;padding:1px 6px}
#col-at .tag{background:var(--at)} #col-intl .tag{background:var(--intl)} #col-mid .tag{background:#444}
.colhead .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colhead button{font-size:12px;padding:2px 8px;border:1px solid var(--line);background:var(--soft);border-radius:4px;cursor:pointer}
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 12px 40vh 12px;scroll-behavior:auto}
.toc{display:none;position:absolute;top:36px;left:0;right:0;max-height:70%;overflow:auto;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:20;padding:6px 12px 12px}
.toc.open{display:block}
.toc ul{margin:0 0 4px 0;padding-left:16px}
.toc li{margin:1px 0}
.toc a{text-decoration:none;color:var(--ink)}
.toc a:hover{text-decoration:underline}
.toc-group{font-weight:700;margin-top:8px;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.tocdot{display:inline-block;min-width:16px;text-align:center;border-radius:8px;font-size:10px;color:#fff;margin-left:4px;padding:0 4px}
h1.group{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);margin:22px 0 8px;padding-bottom:2px}
article.artifact,article.page{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 12px}
.art-title{font-size:15px;margin:0 0 6px}
.art-title .kind{font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
.srcline{font-size:11px;color:var(--muted);margin-bottom:4px;word-break:break-all}
.desc{margin:4px 0 6px;color:#333}
.note{color:var(--muted);font-size:12px}
table{border-collapse:collapse}
table.kv{font-size:12px;margin-bottom:4px}
table.kv th{text-align:left;color:var(--muted);font-weight:500;padding:1px 10px 1px 0;vertical-align:top;white-space:nowrap}
table.kv td{padding:1px 0;word-break:break-word}
.tbl-wrap{overflow-x:auto}
table.els,table.md{width:100%;font-size:12px;margin:4px 0 6px}
table.els th,table.md th{background:var(--soft);text-align:left;padding:3px 5px;border:1px solid var(--line);font-weight:600}
table.els td,table.md td{border:1px solid var(--line);padding:3px 5px;vertical-align:top}
table.els:not(.codes){table-layout:fixed}
table.els:not(.codes) th:nth-child(1){width:23%}table.els:not(.codes) th:nth-child(2){width:8%}table.els:not(.codes) th:nth-child(3){width:17%}table.els:not(.codes) th:nth-child(4){width:19%}table.els:not(.codes) th:nth-child(5){width:4%}
table.els td{overflow-wrap:anywhere}
td.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
td.path .slice{color:#7a3db8;font-weight:600}
td.path .loc{display:block;color:#8a95a3;font-size:10px}
td.card{white-space:nowrap}
.card-chg{font-weight:700}
.basecard{display:block;color:#8a95a3;font-size:10px}
td.ms{text-align:center;font-weight:700;color:#b35c00}
.short{font-weight:600}
.def,.cmt{color:#444}
.req{color:#6a4a00;background:#fff8e1;padding:0 3px;border-radius:2px;margin-top:2px}
.inv{color:#5b2e86;margin-top:2px}
.strength{font-size:10.5px;padding:0 4px;border-radius:3px;background:#e7ebf0}
.s-required{background:#fde2e1}.s-extensible{background:#fff0d6}.s-preferred{background:#e2f0ff}
.fixed{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#1a5d2a}
.slicing{display:inline-block;font-size:11px;color:#7a3db8}
pre.code{background:#f3f5f8;border:1px solid var(--line);padding:6px;overflow:auto;max-height:340px;font-size:11.5px}
.code-cap{font-size:11px;color:var(--muted)}
blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid #c3cbd6;color:#444;background:#fafbfc}
.liquid{font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:3px 6px;margin:4px 0}
.local-link{border-bottom:1px dotted #8a95a3}
.md-img{max-width:100%;height:auto;border:1px solid var(--line)}
.missing-img{color:var(--muted)}
.stu-note{background:#fff8e1;border-left:3px solid #e0b400;padding:4px 8px}
.inum{font-weight:700;color:var(--muted);text-decoration:none}.inum:hover{text-decoration:underline}
.ccount{font-size:11px;color:var(--muted);white-space:nowrap}
.b.closed{background:#6e7781;color:#fff}
.disc{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.disc-h{font-weight:700;font-size:12px;margin-bottom:4px}.disc-h a{font-weight:400;margin-left:6px}
.cmt{border:1px solid var(--line);border-radius:6px;margin:6px 0;background:#fff}
.cmt-h{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;background:#f6f8fa;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.cmt-h img{width:20px;height:20px;border-radius:50%}
.cmt-b{padding:4px 10px;font-size:13px;overflow-x:auto}.cmt-b p{margin:4px 0}.cmt-b img{max-width:100%}
.muted{color:var(--muted);font-size:12px}
.modes{display:flex;gap:0}
.modes .mode{font-size:12px;padding:2px 10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.modes .mode:first-child{border-radius:4px 0 0 4px}.modes .mode:last-child{border-radius:0 4px 4px 0;border-left:0}
.modes .mode.on{background:#1d232b;color:#fff;border-color:#1d232b}
:root{--pl-eu:#1f6feb;--pl-eu-intl:#8250df;--pl-at:#b60205;--pl-drop:#6e7781;--pl-open:#bf8700}
.card.vcard[data-pl="eu"]{--rc:var(--pl-eu)}.card.vcard[data-pl="eu-intl"]{--rc:var(--pl-eu-intl)}.card.vcard[data-pl="at"]{--rc:var(--pl-at)}
.card.vcard[data-pl="drop"]{--rc:var(--pl-drop)}.card.vcard[data-pl="open"]{--rc:var(--pl-open)}
.b.pl{background:var(--rc);color:#fff;font-weight:600}
.vid{font:11px ui-monospace,monospace;color:var(--muted)}
.counts.c5{grid-template-columns:repeat(5,1fr)}
.count.pl-eu{background:var(--pl-eu)}.count.pl-eu-intl{background:var(--pl-eu-intl)}.count.pl-at{background:var(--pl-at)}.count.pl-drop{background:var(--pl-drop)}.count.pl-open{background:var(--pl-open)}
.linkv{cursor:pointer;color:#1f5fa8;text-decoration:underline dotted;font:11px ui-monospace,monospace}
.rchip.dchip{background:#fff7e6}
#eu-summary details{margin:4px 0}#eu-summary summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#eu-summary .q{margin:6px 0;padding-left:8px;border-left:3px solid var(--line)}
#eu-summary table{border-collapse:collapse;font-size:12px;width:100%}#eu-summary td,#eu-summary th{border-bottom:1px solid var(--soft);padding:2px 4px;vertical-align:top;text-align:left}
#gh-auth{display:flex;align-items:center;gap:6px;font-size:12px;color:#c9d1db}
#gh-auth img{width:20px;height:20px;border-radius:50%}
#gh-auth a{color:#c9d1db}
#gh-msg{display:none;position:fixed;top:48px;right:12px;z-index:50;max-width:420px;background:#fff8e1;border:1px solid #e0a800;border-radius:6px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px #0002}
#gh-msg.show{display:block}
.composer{margin-top:6px}
.composer textarea{width:100%;min-height:70px;font:13px/1.4 system-ui,sans-serif;padding:6px;border:1px solid var(--line);border-radius:6px;resize:vertical;box-sizing:border-box}
.composer .row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.composer button{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid #1f883d;background:#1f883d;color:#fff;cursor:pointer}
.composer button.sec{background:#f6f8fa;color:var(--ink);border-color:var(--line)}
.composer button:disabled{opacity:.6;cursor:default}
a.reply{display:inline-block;margin-top:4px;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:#f6f8fa}
details.example{border-top:1px solid var(--soft);padding:2px 0}
details.example summary{cursor:pointer;font-size:12px}
details.intro{margin:4px 0;border:1px solid var(--soft);padding:2px 6px;border-radius:4px}
details.intro summary{cursor:pointer;font-size:12px;color:var(--muted)}
.sec{color:#7a3db8}
.page h3,.page h4,.page h5,.page h6{margin:10px 0 4px}
.page h3{font-size:14px}.page h4{font-size:13.5px}.page h5,.page h6{font-size:13px}

/* region state */
.region.has-diff{cursor:pointer}
article.region.has-diff,section.region.has-diff,details.region.has-diff{box-shadow:-3px 0 0 0 var(--rc,#999)}
tr.region.has-diff>td:first-child{box-shadow:inset 3px 0 0 0 var(--rc,#999)}
.region[data-recon="unreconcilable"]{--rc:var(--r-unrec)}
.region[data-recon="reconcilable-with-change"]{--rc:var(--r-change)}
.region[data-recon="at-only-derivable"]{--rc:var(--r-derive)}
.region[data-recon="equivalent"]{--rc:var(--r-equiv)}
.region.hl{background:var(--hl)!important;outline:2px solid var(--hlline);outline-offset:-1px}
tr.region.hl>td{background:var(--hl)}
.region.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{outline:3px solid #ff6d00}100%{outline:3px solid transparent}}
.region.hoverpeer{outline:1px dashed #555;outline-offset:-1px}
.dbadge{display:inline-block;font-size:10px;font-weight:600;color:#fff;background:var(--rc,#777);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:middle;white-space:nowrap;font-family:system-ui,sans-serif}
.only{display:inline-block;font-size:10px;font-weight:600;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle;white-space:nowrap;border:1px solid;font-family:system-ui,sans-serif}
.only.at{color:var(--at);border-color:var(--at);background:#fff1f0}
.only.intl{color:var(--intl);border-color:var(--intl);background:#eef5ff}
.only.weak{opacity:.75;border-style:dashed}
article.region.unmatched{border-style:dashed}
section.region.unmatched-sec{border-left:2px dashed #c3cbd6;padding-left:6px}

/* middle lane */
#col-mid{background:#fbfcfd}
#mid-body{padding:8px 10px 40vh}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.panel h2{font-size:14px;margin:0 0 6px}
.panel h3{font-size:12.5px;margin:8px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count{border-radius:6px;padding:6px;color:#fff;cursor:pointer;text-align:center;user-select:none}
.count b{display:block;font-size:20px;line-height:1.1}
.count span{font-size:10.5px}
.count.unreconcilable{background:var(--r-unrec)}.count.reconcilable-with-change{background:var(--r-change)}
.count.at-only-derivable{background:var(--r-derive)}.count.equivalent{background:var(--r-equiv)}
.count.off{opacity:.35}
.kindtable{width:100%;font-size:11.5px}
.kindtable td{padding:1px 4px;border-bottom:1px solid var(--soft)}
.kindtable td.n{text-align:right;width:28px}
.kindtable .bar{height:8px;display:flex;border-radius:2px;overflow:hidden}
.kindtable .bar i{display:block;height:100%}
.headline li{margin:3px 0}
.linkitem{cursor:pointer;color:#1f5fa8;text-decoration:underline dotted}
.banner{border-radius:6px;padding:6px 8px;margin-bottom:8px;font-size:12px}
.banner.warn{background:#fff3e0;border:1px solid #f0b46a}
.banner.err{background:#fdecea;border:1px solid #e57373}
.banner.info{background:#eef5ff;border:1px solid #9cc0ef}
.filters{display:flex;flex-direction:column;gap:5px}
.frow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.frow>label.fl{font-size:11px;color:var(--muted);width:66px}
.chip{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:1px 7px;cursor:pointer;user-select:none}
.chip.on{background:#1d232b;color:#fff;border-color:#1d232b}
#q{flex:1;min-width:120px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px}
.listinfo{font-size:11.5px;color:var(--muted);margin:4px 0 6px;display:flex;gap:8px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--rc,#999);border-radius:6px;margin-bottom:7px;padding:6px 8px;cursor:pointer}
.card[data-recon="unreconcilable"]{--rc:var(--r-unrec)}
.card[data-recon="reconcilable-with-change"]{--rc:var(--r-change)}
.card[data-recon="at-only-derivable"]{--rc:var(--r-derive)}
.card[data-recon="equivalent"]{--rc:var(--r-equiv)}
.card.sel{box-shadow:0 0 0 2px #1d232b}
.card.peer{box-shadow:0 0 0 2px var(--hlline);background:#fffdf0}
.card .t{font-weight:600;font-size:13px}
.card .badges{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0}
.b{font-size:10px;border-radius:3px;padding:0 5px;background:var(--soft);color:#333;white-space:nowrap}
.b.recon{background:var(--rc);color:#fff;font-weight:600}
.b.sev-high{background:#2b2b2b;color:#fff}.b.sev-medium{background:#7a8594;color:#fff}.b.sev-low{background:#dfe4ea}
.b.scen{background:#e0f2ef;color:#0b5d52}
.b.lvl{background:#e9e1f7;color:#4b2a85}
.b.unc{background:#fff3cd;color:#7a5600;border:1px solid #e0b400}
.b.pres-at-only{background:#fff1f0;color:var(--at)}.b.pres-intl-only{background:#eef5ff;color:var(--intl)}
.card .detail{display:none;margin-top:4px;font-size:12.5px}
.card.sel .detail{display:block}
.card .detail p{margin:3px 0 5px}
.card .tp{border-left:3px solid #1d232b;background:#f3f5f8;padding:4px 8px;margin:6px 0;font-style:italic}
.card .chg{background:#fff8e1;border-radius:4px;padding:2px 8px;margin:4px 0}

.ev{font-size:11px;color:var(--muted);margin:3px 0 0;padding-left:16px}

#tip .ti{margin:2px 0;padding-left:8px;border-left:4px solid var(--rc,#999)}

#tip .ti[data-recon="at-only-derivable"]{--rc:var(--r-derive)}#tip .ti[data-recon="equivalent"]{--rc:var(--r-equiv)}

<body>
<div id="top">
  <h1>AI Transparency on FHIR: HL7 Austria (left) vs HL7 International (right)</h1>
  <div class="meta" id="topmeta"></div>
  <div class="grow"></div>
  <span id="gh-auth"></span>
  <button id="btn-clear" title="Clear selection and filters (Esc)">Clear</button>
</div>
<div id="gh-msg"></div>
<div id="grid">
  <div class="col" id="col-at">
    <div class="colhead"><span class="tag">AT</span><span class="grow">%%AT_HEAD%%</span><button data-toc="toc-at">Contents</button></div>
    <nav class="toc" id="toc-at">%%AT_TOC%%</nav>
    <div class="body side" id="body-at" data-side="at">%%AT_BODY%%</div>
  </div>
  <div class="col" id="col-mid">
    <div class="colhead"><span class="modes" id="modes"><button class="mode on" data-mode="diff" title="Differences between the AT and the Intl IG">AT &harr; Intl</button><button class="mode" data-mode="eu" title="Where each part of the AT IG belongs: HL7 Europe, Intl, AT, drop or open">AT &rarr; EU</button></span><span class="grow"></span><button id="btn-summary">Summary</button></div>
    <div class="body" id="mid-body">
      <div id="banners"></div>
      <div id="diff-view">
        <div class="panel" id="summary"></div>
        <div class="panel">
          <div class="filters" id="filters"></div>
        </div>
        <div class="listinfo" id="listinfo"></div>
        <div id="list"></div>
      </div>
      <div id="eu-view" style="display:none">
        <div class="panel" id="eu-summary"></div>
        <div class="panel"><div class="filters" id="eu-filters"></div></div>
        <div class="listinfo" id="eu-listinfo"></div>
        <div id="eu-list"></div>
      </div>
    </div>
  </div>
  <div class="col" id="col-intl">
    <div class="colhead"><span class="tag">Intl</span><span class="grow">%%INTL_HEAD%%</span><button data-toc="toc-intl">Contents</button></div>
    <nav class="toc" id="toc-intl">%%INTL_TOC%%</nav>
    <div class="body side" id="body-intl" data-side="intl">%%INTL_BODY%%</div>
  </div>
</div>
<div id="tip"></div>
<pre id="selftest-result"></pre>
<script type="application/json" id="data">%%DATA%%</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items, BY = {};
ITEMS.forEach(it => BY[it.id] = it);
const RECON = DATA.recon, KINDS = DATA.kinds;
const RLABEL = {"unreconcilable":"unreconcilable","reconcilable-with-change":"reconcilable with change","at-only-derivable":"AT-only, derivable","equivalent":"equivalent"};
const RRANK = {"unreconcilable":0,"reconcilable-with-change":1,"at-only-derivable":2,"equivalent":3};
const SEVRANK = {high:0, medium:1, low:2};
const SIDEKEY = {at:'left_refs', intl:'right_refs'};
const SIDELABEL = {at:'AT', intl:'Intl'};
const body = {at: document.getElementById('body-at'), intl: document.getElementById('body-intl')};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SELFTEST = location.hash.indexOf('selftest') >= 0;

/* ---------- region index ---------- */
const REG = {at:new Map(), intl:new Map()};
for (const s of ['at','intl']) body[s].querySelectorAll('.region[data-ref]').forEach(el => { if (!REG[s].has(el.dataset.ref)) REG[s].set(el.dataset.ref, el); });
const REFITEMS = {at:new Map(), intl:new Map()};

/* ---------- GitHub sign-in + comments ----------
   Signing in goes through the GitHub App of this repo; the Worker in worker/ swaps the one-time
   code for a user token (kept in sessionStorage only). Comments are posted as the signed-in user.
   Everyone sees the comments of the opened item live from the GitHub API (falls back to the copy
   baked in at build time). Anyone signed in to GitHub can comment. */
const GH = { repo: DATA.repo || null, auth: DATA.auth || null, token: null, user: null, canComment: false, fetched: {} };
function ghHeaders(extra){
  const h = {'Accept': 'application/vnd.github.html+json', 'X-GitHub-Api-Version': '2022-11-28'};
  if (GH.token) h.Authorization = 'Bearer ' + GH.token;
  return Object.assign(h, extra || {});
}
async function gh(path, opts){
  const r = await fetch('https://api.github.com' + path, Object.assign({headers: ghHeaders()}, opts || {}));
  if (!r.ok) { const e = new Error(r.status + ' ' + (await r.text()).slice(0, 200)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
function authMsg(text){ const m = document.getElementById('gh-msg'); m.textContent = text; m.classList.add('show'); clearTimeout(authMsg.t); authMsg.t = setTimeout(() => m.classList.remove('show'), 8000); }

async function exchange(payload){
  const r = await fetch(GH.auth.token_url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
  const t = await r.json().catch(() => ({}));
  if (!r.ok || !t.access_token) throw new Error(t.error_description || t.error || ('HTTP ' + r.status));
  const s = {token: t.access_token, exp: Date.now() + ((t.expires_in || 28800) - 60) * 1000, refresh: t.refresh_token || null};
  sessionStorage.setItem('gh-auth', JSON.stringify(s));
  return s;
}
function signIn(){
  const state = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  sessionStorage.setItem('gh-state', state);
  sessionStorage.setItem('gh-return', location.hash);
  const u = new URL('https://github.com/login/oauth/authorize');
  u.searchParams.set('client_id', GH.auth.client_id);
  u.searchParams.set('redirect_uri', location.origin + location.pathname);
  u.searchParams.set('state', state);

function signOut(){ sessionStorage.removeItem('gh-auth'); GH.token = GH.user = null; GH.canComment = false; renderAuth(); rerenderCards(); }
function renderAuth(){

  el.innerHTML = GH.user
    ? '<img src="' + esc(GH.user.avatar_url) + '&s=40" alt=""><span>' + esc(GH.user.login) + '</span><button id="gh-out">Sign out</button>'
    : '<button id="gh-in" title="Sign in to comment on the items">Sign in with GitHub</button>';

  if (i) i.onclick = signIn; if (o) o.onclick = signOut;
}
function composerHTML(it){

  if (!GH.auth || !GH.repo) return gl;

  return '<div class="composer" data-issue="' + it.issue.number + '"><textarea placeholder="Comment as ' + esc(GH.user.login) + ' (Markdown supported)"></textarea>' +
    '<div class="row"><button class="c-post">Comment</button><span class="muted">posted to issue #' + it.issue.number + ' as ' + esc(GH.user.login) + '</span></div></div>';
}
function rerenderCard(id){

  const sel = card.classList.contains('sel'), ta = card.querySelector('.composer textarea'), draft = ta ? ta.value : '';
  card.outerHTML = EBY[id] ? vcardHTML(EBY[id]) : cardHTML(BY[id]);

}
function rerenderCards(){ document.querySelectorAll('#list .card').forEach(c => rerenderCard(c.dataset.id)); }
function toComment(c){ return {author: c.user.login, avatar: c.user.avatar_url + '&s=48', url: c.html_url, created: c.created_at, updated: c.updated_at, body_html: c.body_html || '', body: c.body || ''}; }
async function liveComments(id, force){
  const it = BY[id] || EBY[id]; if (!it || !it.issue || !GH.repo || SELFTEST) return;
  const last = GH.fetched[id] || 0; if (!force && Date.now() - last < 60000) return;
  GH.fetched[id] = Date.now();
  try {
    const cs = await gh('/repos/' + GH.repo + '/issues/' + it.issue.number + '/comments?per_page=100');
    it.issue.comments = cs.map(toComment); rerenderCard(id);

async function onComposerClick(e){
  if (e.target.closest('.gh-signin')) { signIn(); return; }

  const box = btn.closest('.composer'), ta = box.querySelector('textarea'), body = ta.value.trim();
  if (!body) { ta.focus(); return; }
  const id = btn.closest('.card').dataset.id, it = BY[id] || EBY[id];
  btn.disabled = true; btn.textContent = 'Posting…';
  try {

    it.issue.comments.push(toComment(c)); ta.value = ''; rerenderCard(id);

  } catch(err) {

async function initAuth(){
  if (!GH.auth || !GH.repo || SELFTEST) return;
  const q = new URLSearchParams(location.search);
  if (q.get('code')) {
    const ok = q.get('state') && q.get('state') === sessionStorage.getItem('gh-state');
    const ret = sessionStorage.getItem('gh-return') || '';
    sessionStorage.removeItem('gh-state'); sessionStorage.removeItem('gh-return');
    history.replaceState(null, '', location.pathname + ret);
    if (!ok) authMsg('Sign-in failed (state mismatch), please try again.');
    else { try { await exchange({code: q.get('code')}); } catch(e) { authMsg('Sign-in failed: ' + e.message); } }
    const m2 = ret.match(/item=([^&]+)/), m3 = ret.match(/(?:^#|&)v=([^&]+)/);
    if (m2 && BY[decodeURIComponent(m2[1])]) select(decodeURIComponent(m2[1]));
    else if (m3 && EBY[decodeURIComponent(m3[1])]) { setMode('eu'); selectV(decodeURIComponent(m3[1])); }
  } else if (q.get('error')) {
    history.replaceState(null, '', location.pathname + location.hash);
    authMsg('Sign-in cancelled: ' + (q.get('error_description') || q.get('error')));
  }
  let s = storedSession();
  if (s && s.exp <= Date.now()) { try { s = s.refresh ? await exchange({refresh_token: s.refresh}) : null; } catch(e) { s = null; } if (!s) sessionStorage.removeItem('gh-auth'); }
  if (s) {
    GH.token = s.token;
    try {
      GH.user = await gh('/user'); GH.canComment = true;
    } catch(e) { GH.token = null; sessionStorage.removeItem('gh-auth'); authMsg('Your sign-in expired, please sign in again.'); }
  }
